spring:
  application:
    name: spracherkennung
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: none
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 260MB

server:
  port: ${SERVER_PORT}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

salutespeech:
  client-id: ${SALUTESPEECH_CLIENT_ID}
  client-secret: ${SALUTESPEECH_CLIENT_SECRET}
  auth-url: ${SALUTESPEECH_AUTH_URL}
  api-url: ${SALUTESPEECH_API_URL}
  scope: ${SALUTESPEECH_SCOPE}

spracherkennung:
  upload-dir: ${UPLOAD_DIR}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}
