openapi: 3.1.0
info:
  title: Spracherkennung API
  version: 1.0.0
servers:
  - url: http://localhost:1807

tags:
  - name: Auth
  - name: Transcriptions

security:
  - bearerAuth: []

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Регистрация
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: OK
        '409':
          description: Логин или email уже занят

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Вход
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверный email или пароль

  /api/transcriptions/recognize:
    post:
      tags: [Transcriptions]
      summary: Распознать аудио
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Поддерживается только MP3.
      responses:
        '202':
          description: Распознавание начато
        '400':
          description: Файл не подходит для распознавания
        '401':
          description: Нет токена

  /api/transcriptions/recognize-again:
    post:
      tags: [Transcriptions]
      summary: Распознать существующий файл заново
      description: Создает новую транскрипцию и запускает новую задачу распознавания только если файл с таким хэшем уже есть у пользователя.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Поддерживается только MP3.
      responses:
        '202':
          description: Повторное распознавание начато
        '400':
          description: Файл еще не существует в системе или не подходит для распознавания
        '401':
          description: Нет токена

  /api/transcriptions:
    get:
      tags: [Transcriptions]
      summary: История
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionHistoryResponse'
        '400':
          description: Некорректные параметры страницы
        '401':
          description: Нет токена

  /api/transcriptions/{id}:
    get:
      tags: [Transcriptions]
      summary: Детали и текст
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionDetails'
        '401':
          description: Нет токена
        '404':
          description: Детали транскрипции недоступны

  /api/transcriptions/{id}/export:
    get:
      tags: [Transcriptions]
      summary: Скачать конспект
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Файл
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Ошибка экспорта
        '401':
          description: Нет токена

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    RegisterRequest:
      type: object
      required: [login, email, password]
      properties:
        login: { type: string, example: "ivan" }
        email: { type: string, example: "ivan@mail.ru" }
        password: { type: string, example: "123456" }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, example: "ivan" }
        password: { type: string, example: "123456" }

    LoginResponse:
      type: object
      properties:
        token: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." }

    TranscriptionHistoryResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptionHistoryItem'
        hasMore: { type: boolean, example: true }

    TranscriptionHistoryItem:
      type: object
      properties:
        id: { type: integer, example: 42 }
        fileName: { type: string, example: "lecture.mp3" }
        format: { type: string, example: "MP3" }
        language: { type: string, example: "ru-RU" }
        uploadedAt: { type: string, format: date-time, example: "2025-01-15T14:30:00Z" }
        status: { type: string, example: "DONE" }
        sizeBytes: { type: integer, format: int64, example: 15728640 }

    TranscriptionDetails:
      type: object
      properties:
        errorMessage:
          type: string
          nullable: true
          example: "Превышен лимит запросов к сервису распознавания. Попробуйте позже."
        durationSeconds:
          type: number
          nullable: true
          example: 1876.5
        characterCount:
          type: integer
          description: Количество символов распознанного текста, включая пробелы и знаки препинания.
          nullable: true
          example: 12500
        sentenceCount:
          type: integer
          nullable: true
          example: 342
        semanticBlocks:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SemanticBlock'

    SemanticBlock:
      type: object
      properties:
        orderIndex: { type: integer, example: 0 }
        textContent: { type: string, example: "Сегодня мы поговорим об..." }
